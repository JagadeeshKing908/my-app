name: App-deployment
on: 
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v4 
  image: 
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v4 
      - name: Installing docker
        uses: docker/setup-buildx-action@v4
      - name: Docker version
        run: |
          docker --version 
      - name: Build image
        run: docker build -t myimage .
      - name: run Container
        run: docker run -d -p 9000:3000 myimage
   
      
        
        
