name: App-deployment
on: 
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v4
      - name: Setup NodeJs
        uses: actions/setup-node@v4
        with:
          node-version: 18
          
      - name: Install dependicies
        run: npm install
          
      - name: Installing docker
        uses: docker/setup-buildx-action@v4
        
      - name: Docker version
        run: |
          docker --version 
          chmod 777 /var/run/docker.sock
        
        
      - name: Build image
        run: docker build -t myimage .
        
      - name: run Container
        run: docker run -d -p 9000:3000 myimage
      
        
        
