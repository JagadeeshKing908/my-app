---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-1
spec:
  replicas: 3
  selector:
    matchLables:
      app: swiggy
  template:
     metadata:
       label:
         app: swiggy
     spec:
       containers:
          name: cont-1
          image: jagadeesh9088/githubactionsfirstimage:myimage
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata: 
  name: mylbservice
spec:
  type: LoadBalancer
  selector:
      app: swiggy
  ports:
    - port: 80
      targetPort: 80
  
            
       
